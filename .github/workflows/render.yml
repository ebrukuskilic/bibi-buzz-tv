name: Render Bibi Buzz TV episode

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Add text-to-speech voice-over (edge-tts)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install voice-over dependency
        if: ${{ inputs.voice }}
        run: pip install -r requirements-voice.txt

      - name: Render video
        run: python render.py ${{ inputs.voice && '--voice' || '' }}

      - name: Render thumbnail
        run: python render.py --thumbnail

      - uses: actions/upload-artifact@v4
        with:
          name: bibi-buzz-ep01
          path: |
            out/bibi_buzz_ep01.mp4
            out/thumbnail.png

      - name: Publish a release (direct .mp4 download, no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ep01-run${{ github.run_number }}" out/bibi_buzz_ep01.mp4 out/thumbnail.png \
            --title "Bibi Buzz TV - Episode 1 (run ${{ github.run_number }})" \
            --notes "Rendered by GitHub Actions. Download bibi_buzz_ep01.mp4 and upload it to YouTube."
