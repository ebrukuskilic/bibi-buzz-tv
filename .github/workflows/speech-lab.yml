name: speech-lab

# A laboratory for the voices of the narrator and the characters (tools/speech_lab.py): the same ten lines of a fairy tale in several engines
# (the voices of the daily videos, plain Edge voices, Edge "Multilingual" voices, Kokoro, Kokoro-Turkish, Chatterbox), every line measured (UTMOS naturalness,
# Whisper word errors, seconds of work per second of speech). It touches neither the daily videos nor the "media" branch: the result goes to the
# "speech-output" branch (raw files: https://raw.githubusercontent.com/<owner>/<repo>/speech-output/en-3-kokoro.mp3 ...; the numbers are in lab.txt).
# It also runs by itself whenever tools/speech_lab.py, tools/cbx_synth.py or this file changes on main.
#
# Two jobs, so that the job which installs and runs other people's packages (pip, models) has no write permission at all:
#   lab      (read-only token)  makes the scenes and keeps them as an artifact
#   publish  (write token)      only copies that artifact to the speech-output branch; it installs nothing and runs no model
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Engines to run: keys separated by commas (e.g. palette,studio,gallery,cast,prod-kokoro,kokoro-tr) or all (palette = every voice at several sizes, gallery = the casting of some tales, studio = EQ chains, cast = the casting sweep)"
        default: "all"
      cbx:
        description: "Also try Chatterbox (a big neural voice in its own python 3.11 environment, slow on the CPU): yes or no"
        default: "no"
      myvoice:
        description: "Chatterbox speaks in the voice of the reference clips of the secrets MYVOICE_TR and MYVOICE_EN (the voice of the channel's owner, who agreed to it; the scenes are published only encrypted): yes or no"
        default: "no"
  push:
    branches: [main]
    paths:
      - "tools/speech_lab.py"
      - "tools/cbx_synth.py"
      - ".github/workflows/speech-lab.yml"

permissions:
  contents: read

concurrency:
  group: bibi-speech-lab-${{ github.event.inputs.myvoice == 'yes' && 'myvoice' || 'main' }}          # (a run with the owner's voice and a run of the other tests do not stop each other)
  cancel-in-progress: true

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ONLY: ${{ github.event.inputs.only || 'gallery' }}      # (a run started by a push does only the newest job: the gallery, the casting of some tales the way the videos make it)
      CBX: ${{ github.event.inputs.cbx || 'no' }}
      MYVOICE: ${{ github.event.inputs.myvoice || 'no' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        id: py311
        with:
          python-version: "3.11"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools, fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng libsndfile1
          python -m pip install --upgrade pip
          pip install pillow numpy scipy edge-tts gTTS soundfile
          mkdir -p assets
          curl -fL --retry 4 -o assets/Fredoka-Variable.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/fredoka/Fredoka%5Bwdth%2Cwght%5D.ttf"
          curl -fL --retry 4 -o assets/Baloo2-Variable.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/baloo2/Baloo2%5Bwght%5D.ttf"

      - name: Install the neural models (CPU)
        continue-on-error: true
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.4" || echo "kokoro install failed"
          pip install faster-whisper || echo "faster-whisper install failed"
          pip list 2>/dev/null | grep -i -E "^(torch|torchaudio|kokoro|misaki|faster-whisper|ctranslate2|transformers|numpy|scipy|spacy) " || true
          ffmpeg -hide_banner -filters 2>/dev/null | grep -i rubberband || echo "NO rubberband in this ffmpeg"
          espeak-ng --version || true

      - name: Speech lab (the voices of the videos, Edge, Kokoro, Kokoro-Turkish)
        run: |
          ARGS=""
          if [ "$ONLY" != "all" ]; then ARGS="--only $ONLY"; fi
          python tools/speech_lab.py main --out out/speech $ARGS
          ls -la out/speech

      - name: Install Chatterbox in its own environment (python 3.11)
        if: env.CBX == 'yes' || env.MYVOICE == 'yes'
        continue-on-error: true
        run: |
          mkdir -p out/speech
          {
            "${{ steps.py311.outputs.python-path }}" -m venv /opt/cbx
            /opt/cbx/bin/pip install --upgrade pip
            /opt/cbx/bin/pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            /opt/cbx/bin/pip install chatterbox-tts
            /opt/cbx/bin/pip list 2>/dev/null | grep -i -E "^(torch|torchaudio|chatterbox-tts|numpy|transformers|librosa|diffusers|safetensors|s3tokenizer|resemble-perth) " || true
            /opt/cbx/bin/python -c "from chatterbox.mtl_tts import ChatterboxMultilingualTTS; print('chatterbox multilingual imports fine')"
          } 2>&1 | tee out/speech/cbx_install.txt

      - name: Chatterbox speaks
        if: env.CBX == 'yes'
        continue-on-error: true
        run: |
          test -x /opt/cbx/bin/python || { echo "there is no Chatterbox environment"; exit 1; }
          python tools/speech_lab.py cbx-prepare --out out/speech
          for L in tr en; do
            timeout 1700 /opt/cbx/bin/python tools/cbx_synth.py out/speech/_cbx_$L.json out/speech/_cbx_$L 2>&1 | tee out/speech/cbx_run_$L.txt || true
          done
          python tools/speech_lab.py cbx-collect --out out/speech

      - name: Your voice - the reference clips (from the secrets; they are never part of the result)
        if: env.MYVOICE == 'yes'
        continue-on-error: true
        env:
          MYVOICE_TR: ${{ secrets.MYVOICE_TR }}
          MYVOICE_EN: ${{ secrets.MYVOICE_EN }}
        run: python tools/speech_lab.py myvoice-prepare --out out/speech

      - name: Chatterbox speaks in your voice
        if: env.MYVOICE == 'yes'
        continue-on-error: true
        run: |
          test -x /opt/cbx/bin/python || { echo "there is no Chatterbox environment"; exit 1; }
          for L in tr en; do
            if [ -f out/speech/_myvoice_$L.json ]; then
              timeout 1700 /opt/cbx/bin/python tools/cbx_synth.py out/speech/_myvoice_$L.json out/speech/_myvoice_$L 2>&1 | tee out/speech/myvoice_run_$L.txt || true
            fi
          done
          python tools/speech_lab.py myvoice-collect --out out/speech

      - name: Collect the result (mp3 scenes and text files only)
        if: ${{ !cancelled() }}
        env:
          MYVOICE_TR: ${{ secrets.MYVOICE_TR }}
        run: |
          mkdir -p result out/speech
          find out/speech -maxdepth 1 -type f \( -name '*.mp3' -o -name '*.txt' \) -exec cp {} result/ \;
          # The scenes in the voice of the channel's owner are a copy of her voice and this repository is public: they are published only encrypted (AES-256, the key is
          # the SHA-256 of the secret MYVOICE_TR, so only somebody who has her clip can open them); without that secret they are not published at all.
          KEY=""
          if [ -n "$MYVOICE_TR" ]; then KEY=$(printf %s "$MYVOICE_TR" | sha256sum | cut -d' ' -f1); fi
          for f in result/*myvoice*.mp3; do
            [ -f "$f" ] || continue
            if [ -n "$KEY" ]; then openssl enc -aes-256-cbc -pbkdf2 -salt -in "$f" -out "$f.enc" -pass "pass:$KEY"; fi
            rm -f "$f"
          done
          ls -la result

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: speech-lab
          path: result
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: lab
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: bibi-speech-publish                     # (two runs publish one after the other: the branch is rewritten from what is there)
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: speech-lab
          path: new

      - name: Publish on the speech-output branch (what was there stays, the new files replace the old ones of the same name)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_NO: ${{ github.run_number }}
        run: |
          mkdir pub && cd pub
          git init -q -b speech-output
          git config user.name "bibi-bot"
          git config user.email "bibi-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin speech-output; then git checkout -q FETCH_HEAD -- . || true; fi
          cp ../new/* . 2>/dev/null || true
          if [ -f lab.txt ]; then cp lab.txt "lab-run${RUN_NO}.txt"; fi
          git add -A
          git commit -q --allow-empty -m "speech lab run ${RUN_NO}"
          git push -q --force origin speech-output
          ls -la
