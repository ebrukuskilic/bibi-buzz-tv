name: test-render

# A test render of ONE fairy tale in ONE language, or of lessons (real fonts, real voices): cover, a contact sheet of every scene, the
# script with the voice of every line, and short clips with sound. It touches neither the daily videos nor the "media" branch: the result goes to the
# "test-output" branch (raw files: https://raw.githubusercontent.com/<owner>/<repo>/test-output/<tale>-<lang>-sheet.png ...).
on:
  workflow_dispatch:
    inputs:
      tale:
        description: "Tale key (three-little-pigs, tortoise-and-hare, goldilocks) or lesson ids like d003-L1,d003-L4 (comma separated)"
        default: "three-little-pigs"
      lang:
        description: "Language of a tale: en or tr (lessons are English)"
        default: "tr"
      seconds:
        description: "Length of the clip with real voices in seconds (0 = no clip)"
        default: "45"
      tail:
        description: "Also render the LAST n seconds (the end and the like / subscribe card) with real voices (0 = no)"
        default: "22"
      kokoro:
        description: "The Kokoro neural voices of bibi_buzz/ktts.py for the narrator and the characters: yes or no (an Edge voice stands in for every line Kokoro cannot make)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: bibi-test-render
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools, fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install pillow numpy edge-tts gTTS
          mkdir -p assets
          curl -fL --retry 4 -o assets/Fredoka-Variable.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/fredoka/Fredoka%5Bwdth%2Cwght%5D.ttf"
          curl -fL --retry 4 -o assets/Baloo2-Variable.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/baloo2/Baloo2%5Bwght%5D.ttf"
          ls -la assets

      - uses: actions/cache@v4
        if: github.event.inputs.kokoro == 'yes'
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-v1

      - name: Install the Kokoro voices (CPU)
        if: github.event.inputs.kokoro == 'yes'
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq espeak-ng libsndfile1
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.4" soundfile
          ffmpeg -hide_banner -filters 2>/dev/null | grep -i rubberband || echo "NO rubberband in this ffmpeg"

      - name: Test render
        env:
          TALE: ${{ github.event.inputs.tale }}
          LANG_: ${{ github.event.inputs.lang }}
          SECONDS_: ${{ github.event.inputs.seconds }}
          TAIL_: ${{ github.event.inputs.tail }}
          BIBI_KOKORO: ${{ github.event.inputs.kokoro == 'yes' && 'en,tr' || '' }}
        run: |
          python tools/test_tale.py "$TALE" "$LANG_" --out out/test --seconds "$SECONDS_" --tail "$TAIL_"
          ls -la out/test

      - name: Publish the result on the test-output branch
        if: always()
        run: |
          mkdir -p out/test
          cd out/test
          git init -q -b test-output
          git config user.name "bibi-bot"
          git config user.email "bibi-bot@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "test render: ${{ github.event.inputs.tale }} ${{ github.event.inputs.lang }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" test-output
